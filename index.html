        <span>🛒</span>
        <span>Loja do Billy</span>
        <span class="badge">mercado</span>
      </h3>
      <button class="close-btn" id="btnCloseShop">✕</button>
    </div>
    <div class="modal-body">
      <div class="shop-header">
        <div class="shop-title">🛍️ Compre comidinhas pro Billy</div>
        <div class="shop-coins">🪙 <span id="shopCoins">0</span></div>
      </div>
      <div class="shop-tabs">
        <div class="shop-tab active" data-tab="shop">Loja</div>
        <div class="shop-tab" data-tab="inventory">Inventário</div>
      </div>
      <div id="shopContent"></div>
    </div>
  </div>
</div>

<!-- GAME PICKER -->
<div class="game-picker" id="gamePicker">
  <div class="picker-panel">
    <h3>🎮 Escolha um minigame</h3>
    <div class="picker-grid" id="pickerGrid"></div>
    <button class="picker-close" id="btnPickerClose">Fechar</button>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
/* ================================================================
   BILLY BYTE — Mascote das Escolas do Futuro (v2)
   ================================================================ */
(function () {
  'use strict';

  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
  const pick = (arr) => arr[rand(0, arr.length - 1)];
  const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = rand(0, i);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  const FOME_DURACAO_MS = 45 * 60 * 1000;
  const SONO_DURACAO_MS = 90 * 60 * 1000;
  const SUJEIRA_DURACAO_MS = 60 * 60 * 1000;

  /* ============================================================
     ESTADO
     ============================================================ */
  const state = {
    hunger: 100,
    happy: 80,
    sleep: 100,
    clean: 100,
    coins: 30,
    sleeping: false,
    currentScene: 'garden',
    lastTick: Date.now(),
    inventory: {},   // { foodId: qtd }
    ownedFoods: []   // ids já comprados pelo menos 1 vez
  };

  /* ============================================================
     CENÁRIOS
     ============================================================ */
  const scenes = {
    garden: $('#sceneGarden'),
    kitchen: $('#sceneKitchen'),
    bedroom: $('#sceneBedroom'),
    bathroom: $('#sceneBathroom')
  };

  const btnBack = $('#btnBack');

  function switchScene(sceneName) {
    if (state.currentScene === sceneName) return;
    Object.values(scenes).forEach(s => {
      s.classList.remove('active');
      if (s.id === 'sceneGarden') s.classList.remove('hidden');
    });
    if (sceneName === 'garden') {
      scenes.garden.classList.remove('hidden');
      btnBack.classList.remove('show');
    } else {
      scenes.garden.classList.add('hidden');
      scenes[sceneName].classList.add('active');
      btnBack.classList.add('show');
    }
    state.currentScene = sceneName;

    // liga/desliga água
    const water = $('#bathroomWater');
    if (water) water.classList.toggle('on', sceneName === 'bathroom' && state.showering);
  }

  btnBack.addEventListener('click', () => {
    if (state.showering) stopShower();
    if (state.sleeping) wakeUp();
    switchScene('garden');
  });

  /* ============================================================
     ELEMENTOS
     ============================================================ */
  const billyWrapper = $('#billyWrapper');
  const billyBody = $('#billyBody');
  const moodBubble = $('#moodBubble');
  const hungerBar = $('#hungerBar');
  const happyBar = $('#happyBar');
  const sleepBar = $('#sleepBar');
  const cleanBar = $('#cleanBar');
  const hintEl = $('#hint');
  const toastContainer = $('#toastContainer');
  const coinsDisplay = $('#coinsDisplay');

  /* ============================================================
     TOAST
     ============================================================ */
  function showToast(text, duration = 2200, gold = false) {
    const t = document.createElement('div');
    t.className = 'toast' + (gold ? ' gold' : '');
    t.textContent = text;
    toastContainer.appendChild(t);
    setTimeout(() => {
      t.classList.add('fade-out');
      setTimeout(() => t.remove(), 400);
    }, duration);
  }

  /* ============================================================
     MOOD
     ============================================================ */
  let moodTimeout = null;
  function showMood(emoji, duration = 1500) {
    moodBubble.textContent = emoji;
    moodBubble.classList.add('show');
    clearTimeout(moodTimeout);
    moodTimeout = setTimeout(() => moodBubble.classList.remove('show'), duration);
  }

  /* ============================================================
     STATS
     ============================================================ */
  function updateStats() {
    hungerBar.style.width = state.hunger + '%';
    happyBar.style.width = state.happy + '%';
    sleepBar.style.width = state.sleep + '%';
    cleanBar.style.width = state.clean + '%';
    [hungerBar, happyBar, sleepBar, cleanBar].forEach(bar => {
      const val = parseFloat(bar.style.width);
      bar.classList.remove('low', 'mid');
      if (val < 25) bar.classList.add('low');
      else if (val < 55) bar.classList.add('mid');
    });
    coinsDisplay.textContent = state.coins;
    const sc = $('#shopCoins');
    if (sc) sc.textContent = state.coins;
  }

  function addCoins(amount) {
    state.coins += amount;
    updateStats();
    const r = billyWrapper.getBoundingClientRect();
    const coin = document.createElement('div');
    coin.className = 'coin-float';
    coin.textContent = '🪙';
    coin.style.left = (r.left + r.width / 2 + rand(-40, 40)) + 'px';
    coin.style.top = (r.top + 80) + 'px';
    document.body.appendChild(coin);
    setTimeout(() => coin.remove(), 1700);
  }

  /* ============================================================
     ANIMAÇÕES
     ============================================================ */
  function animateBilly(cls, dur = 800) {
    billyBody.classList.add(cls);
    setTimeout(() => billyBody.classList.remove(cls), dur);
  }
  function billyTalk(dur = 1500) {
    billyBody.classList.add('talking');
    setTimeout(() => billyBody.classList.remove('talking'), dur);
  }
  function billyHappy(dur = 1200) {
    billyBody.classList.add('happy');
    setTimeout(() => billyBody.classList.remove('happy'), dur);
  }
  function billyWave() { animateBilly('waving', 1800); }
  function billyJump() { animateBilly('jumping', 700); }
  function billyShake() { animateBilly('shaking', 500); }
  function billyLaugh() { animateBilly('laughing', 1400); }
  function billyEat() { animateBilly('eating', 1200); }
  function billySad() { animateBilly('sad', 1800); }
  function billyExcited() { animateBilly('excited', 1500); }

  /* ============================================================
     EFEITOS
     ============================================================ */
  function spawnHearts(count = 5) {
    const rect = billyWrapper.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + 80;
    for (let i = 0; i < count; i++) {
      const h = document.createElement('div');
      h.className = 'heart-float';
      h.textContent = pick(['💚', '💕', '💖', '💗']);
      h.style.left = (cx + rand(-80, 80)) + 'px';
      h.style.top = (cy + rand(-20, 20)) + 'px';
      h.style.animationDelay = (i * 0.12) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1800 + i * 120);
    }
  }

  function spawnBubbles(count = 8) {
    const rect = billyWrapper.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + 150;
    for (let i = 0; i < count; i++) {
      const b = document.createElement('div');
      b.className = 'bubble-float';
      const size = rand(20, 50);
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = (cx + rand(-100, 100)) + 'px';
      b.style.top = (cy + rand(-40, 40)) + 'px';
      b.style.animationDelay = (i * 0.08) + 's';
      document.body.appendChild(b);
      setTimeout(() => b.remove(), 2200 + i * 100);
    }
  }

  function spawnFlyingItem(emoji, fromX, fromY) {
    const rect = billyWrapper.getBoundingClientRect();
    const tx = rect.left + rect.width / 2;
    const ty = rect.top + rect.height / 2;
    const el = document.createElement('div');
    el.className = 'flying-item';
    el.textContent = emoji;
    el.style.left = fromX + 'px';
    el.style.top = fromY + 'px';
    el.style.setProperty('--dx', (tx - fromX) + 'px');
    el.style.setProperty('--dy', (ty - fromY) + 'px');
    document.body.appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }

  function spawnZzz() {
    if (!state.sleeping) return;
    const rect = billyWrapper.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + 50;
    const z = document.createElement('div');
    z.className = 'zzz';
    z.textContent = 'Z';
    z.style.left = (cx + rand(-20, 20)) + 'px';
    z.style.top = cy + 'px';
    z.style.animationDelay = Math.random() * 0.5 + 's';
    document.body.appendChild(z);
    setTimeout(() => z.remove(), 3200);
  }

  /* ============================================================
     FALAS
     ============================================================ */
  const billyDialogs = {
    pet: ["Adoro carinho! 💚", "Você é o melhor!", "Isso me deixa feliz!", "Mais carinho, por favor!", "Aww, que gostoso!"],
    tickle: ["Hahaha! Para! 😂", "Não! Cócegas! Hihihi!", "Você me pegou! Hahaha!", "Para, para! 🤣", "Cócegas não! Hahaha!"],
    feed: ["Hmm, que delícia! 😋", "Obrigado pela comida!", "Nham nham!", "Adorei! 🍎", "Isso mata minha fome!"],
    play: ["Uhuu! Vamos brincar! 🎾", "Adoro brincar!", "Pega, pega!", "Isso é divertido!", "De novo, de novo!"],
    sleep: ["Boa noite... 💤", "Zzzzz... soninho...", "Vou dormir um pouquinho...", "Bons sonhos..."],
    wake: ["Hmm... acordei! Bom dia!", "Que cochilo bom!", "Oi! Dormi bem!", "Acordei cheio de energia! ⚡"],
    dance: ["Vem dançar comigo! 🎵", "Olha meus passos!", "A música me contagia!", "Dançar é bom demais!"],
    surprise: ["Surpresa! 🎉", "Olha o que eu sei fazer!", "Uhuuu! Que legal!", "Adoro surpresas! ✨"],
    hungry: ["Tô com fome... 🍖", "Minha barriga tá roncando!", "Comida, por favor!", "Quando a gente vai comer?"],
    sleepy: ["Tô com soninho... 😴", "Preciso dormir...", "Que sono!", "Meus olhinhos estão pesados..."],
    dirty: ["Tô precisando de banho! 🚿", "Que sujinha!", "Me leva pro banheiro!", "Tô cheirando mal! 😅"],
    bath: ["Ai que delícia! 🛁", "Água quentinha!", "Limpinho de novo!", "Adoro banho! 🫧", "Splash splash!"],
    bathDone: ["Prontinho! Cheiroso!", "Que banho gostoso!", "Agora sim, limpinho! ✨"]
  };

  function billySpeak(key) {
    if (state.sleeping) return;
    const text = pick(billyDialogs[key] || ["Hmm..."]);
    billyTalk();
    addChatMessage(text, 'billy');
    return text;
  }

  /* ============================================================
     COMIDAS / LOJA
     ============================================================ */
  const foodsCatalog = [
    { id: 'apple',    emoji: '🍎', name: 'Maçã',        price: 5,  value: 15 },
    { id: 'banana',   emoji: '🍌', name: 'Banana',      price: 5,  value: 15 },
    { id: 'bread',    emoji: '🍞', name: 'Pão',         price: 6,  value: 18 },
    { id: 'milk',     emoji: '🥛', name: 'Leite',       price: 6,  value: 12 },
    { id: 'cookie',   emoji: '🍪', name: 'Biscoito',    price: 7,  value: 15 },
    { id: 'fries',    emoji: '🍟', name: 'Batata',      price: 10, value: 22 },
    { id: 'icecream', emoji: '🍦', name: 'Sorvete',     price: 10, value: 20 },
    { id: 'choco',    emoji: '🍫', name: 'Chocolate',   price: 12, value: 25 },
    { id: 'donut',    emoji: '🍩', name: 'Donut',       price: 12, value: 25 },
    { id: 'salad',    emoji: '🥗', name: 'Salada',      price: 13, value: 22 },
    { id: 'pizza',    emoji: '🍕', name: 'Pizza',       price: 20, value: 35 },
    { id: 'burger',   emoji: '🍔', name: 'Hambúrguer',  price: 22, value: 40 },
    { id: 'ramen',    emoji: '🍜', name: 'Lámen',       price: 18, value: 30 }
  ];

  let shopTab = 'shop';

  function openShop() {
    $('#shopModal').classList.add('active');
    renderShop();
  }
  function closeShop() { $('#shopModal').classList.remove('active'); }

  function renderShop() {
    const content = $('#shopContent');
    content.innerHTML = '';

    if (shopTab === 'shop') {
      const grid = document.createElement('div');
      grid.className = 'shop-grid';
      foodsCatalog.forEach(food => {
        const item = document.createElement('div');
        item.className = 'shop-item';
        const owned = state.ownedFoods.includes(food.id);
        const canAfford = state.coins >= food.price;
        if (!canAfford) item.classList.add('cant-afford');
        item.innerHTML = `
          ${owned ? '<div class="shop-owned-badge">✓</div>' : ''}
          <div class="shop-emoji">${food.emoji}</div>
          <div class="shop-name">${food.name}</div>
          <div class="shop-price">🪙 ${food.price}</div>
          <div class="shop-restore">+${food.value} fome</div>
        `;
        item.addEventListener('click', () => buyFood(food));
        grid.appendChild(item);
      });
      content.appendChild(grid);
    } else {
      const inv = state.inventory;
      const ids = Object.keys(inv).filter(k => inv[k] > 0);
      if (ids.length === 0) {
        content.innerHTML = '<div class="feedback hint" style="margin-top:0">Seu inventário está vazio! Compre comidinhas na loja. 🛒</div>';
        return;
      }
      const list = document.createElement('div');
      list.className = 'inventory-list';
      ids.forEach(id => {
        const food = foodsCatalog.find(f => f.id === id);
        if (!food) return;
        const item = document.createElement('div');
        item.className = 'inv-item';
        item.innerHTML = `
          <span class="inv-emoji">${food.emoji}</span>
          <span>${food.name}</span>
          <span class="inv-count">${inv[id]}</span>
        `;
        item.title = 'Clique pra dar pro Billy';
        item.addEventListener('click', () => consumeFood(food));
        list.appendChild(item);
      });
      content.appendChild(list);
      const tip = document.createElement('div');
      tip.className = 'feedback hint';
      tip.style.marginTop = '14px';
      tip.textContent = '💡 Clique num item pra dar pro Billy!';
      content.appendChild(tip);
    }
  }

  function buyFood(food) {
    if (state.coins < food.price) {
      showToast('Moedas insuficientes! 🪙');
      billyShake();
      return;
    }
    state.coins -= food.price;
    state.inventory[food.id] = (state.inventory[food.id] || 0) + 1;
    if (!state.ownedFoods.includes(food.id)) state.ownedFoods.push(food.id);
    updateStats();
    showToast(`Comprou ${food.emoji} ${food.name}!`, 1600, true);
    renderShop();
  }

  function consumeFood(food) {
    if (state.hunger >= 100) { showToast('Billy já está satisfeito! 😊'); return; }
    if ((state.inventory[food.id] || 0) <= 0) return;
    state.inventory[food.id]--;
    closeShop();
    billyEat();
    spawnFlyingItem(food.emoji, window.innerWidth / 2, window.innerHeight / 2);
    setTimeout(() => {
      state.hunger = clamp(state.hunger + food.value, 0, 100);
      state.happy = clamp(state.happy + 3, 0, 100);
      updateStats();
      billySpeak('feed');
      showMood('😋');
      billyHappy();
      spawnHearts(4);
    }, 900);
  }

  $('#btnCloseShop').addEventListener('click', closeShop);
  $('#shopModal').addEventListener('click', e => { if (e.target === $('#shopModal')) closeShop(); });
  $$('.shop-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      $$('.shop-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      shopTab = tab.dataset.tab;
      renderShop();
    });
  });

  $('#fridge').addEventListener('click', () => {
    if (state.currentScene !== 'kitchen') switchScene('kitchen');
    openShop();
  });

  /* ============================================================
     AÇÕES
     ============================================================ */
  function actionFeed() {
    if (state.sleeping) return;
    switchScene('kitchen');
    setTimeout(() => openShop(), 400);
  }

  function actionPet() {
    if (state.sleeping) return;
    state.happy = clamp(state.happy + 8, 0, 100);
    updateStats();
    billySpeak('pet');
    showMood('💚');
    billyHappy();
    spawnHearts(5);
    addCoins(1);
  }

  function actionTickle() {
    if (state.sleeping) return;
    state.happy = clamp(state.happy + 12, 0, 100);
    state.sleep = clamp(state.sleep - 3, 0, 100);
    updateStats();
    billySpeak('tickle');
    showMood('😂');
    billyLaugh();
    spawnHearts(4);
    addCoins(1);
  }

  function actionPlay() {
    if (state.sleeping) return;
    if (state.sleep < 15) { showToast("Billy está com muito sono! Deixe ele dormir. 💤"); return; }
    state.happy = clamp(state.happy + 15, 0, 100);
    state.sleep = clamp(state.sleep - 10, 0, 100);
    state.hunger = clamp(state.hunger - 5, 0, 100);
    state.clean = clamp(state.clean - 5, 0, 100);
    updateStats();
    billySpeak('play');
    showMood('🎾');
    spawnBubbles(10);
    billyWave();
    billyJump();
    addCoins(2);
  }

  function actionDance() {
    if (state.sleeping) return;
    state.happy = clamp(state.happy + 10, 0, 100);
    state.sleep = clamp(state.sleep - 5, 0, 100);
    updateStats();
    billySpeak('dance');
    showMood('🎵');
    let step = 0;
    const iv = setInterval(() => {
      billyBody.style.transform = `rotate(${step % 2 === 0 ? -4 : 4}deg) translateY(${step % 2 === 0 ? -6 : 0}px)`;
      step++;
      if (step > 12) { clearInterval(iv); billyBody.style.transform = ''; }
    }, 100);
    addCoins(2);
  }

  /* ============================================================
     BANHO
     ============================================================ */
  state.showering = false;
  let showerInterval = null;

  function actionBath() {
    if (state.sleeping) return;
    if (state.clean >= 95) {
      showToast('Billy já está limpinho! 🛁');
      return;
    }
    if (state.currentScene !== 'bathroom') {
      switchScene('bathroom');
      showToast('Vamos pro banheiro! 🚿');
    }
    setTimeout(() => startShower(), 500);
  }

  function startShower() {
    if (state.showering) return;
    state.showering = true;
    billyBody.classList.add('showering');
    const water = $('#bathroomWater');
    if (water) water.classList.add('on');
    // gera gotas
    generateWaterDrops();
    // gera bolhas
    generateBathBubbles();
    billySpeak('bath');
    showMood('🫧');

    showerInterval = setInterval(() => {
      state.clean = clamp(state.clean + 3, 0, 100);
      state.happy = clamp(state.happy + 1, 0, 100);
      updateStats();
      if (Math.random() > 0.7) generateBathBubbles();
      if (state.clean >= 100) {
        stopShower();
        billySpeak('bathDone');
        showMood('✨');
        billyHappy(1500);
        spawnHearts(6);
        addCoins(3);
        showToast('Billy tomou banho! +3 🪙', 2000, true);
      }
    }, 300);
  }

  function stopShower() {
    state.showering = false;
    billyBody.classList.remove('showering');
    const water = $('#bathroomWater');
    if (water) water.classList.remove('on');
    if (showerInterval) { clearInterval(showerInterval); showerInterval = null; }
  }

  function generateWaterDrops() {
    const water = $('#bathroomWater');
    if (!water) return;
    water.innerHTML = '';
    for (let i = 0; i < 15; i++) {
      const d = document.createElement('div');
      d.className = 'bathroom-drop';
      d.style.left = rand(0, 100) + '%';
      d.style.height = rand(15, 40) + 'px';
      d.style.animationDelay = (Math.random() * 0.8) + 's';
      d.style.animationDuration = (0.6 + Math.random() * 0.5) + 's';
      water.appendChild(d);
    }
  }

  function generateBathBubbles() {
    const container = $('#bathroomBubbles');
    if (!container) return;
    for (let i = 0; i < 5; i++) {
      const b = document.createElement('div');
      b.className = 'bathroom-bubble';
      const size = rand(15, 40);
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = rand(5, 25) + '%';
      b.style.top = rand(50, 80) + '%';
      b.style.animationDelay = (Math.random() * 1.5) + 's';
      b.style.animationDuration = (2.5 + Math.random() * 1.5) + 's';
      container.appendChild(b);
      setTimeout(() => b.remove(), 4000);
    }
  }

  /* ============================================================
     DORMIR / ACORDAR
     ============================================================ */
  function putToSleep() {
    if (state.sleeping) return;
    state.sleeping = true;
    billyBody.classList.add('sleeping');
    billySpeak('sleep');
    showMood('💤');
    switchScene('bedroom');

    const zzzInterval = setInterval(() => {
      if (!state.sleeping) { clearInterval(zzzInterval); return; }
      spawnZzz();
    }, 1200);

    const sleepRecover = setInterval(() => {
      if (!state.sleeping) { clearInterval(sleepRecover); return; }
      state.sleep = clamp(state.sleep + 1, 0, 100);
      updateStats();
      if (state.sleep >= 100) {
        clearInterval(sleepRecover);
        setTimeout(() => { if (state.sleeping) wakeUp(); }, 500);
      }
    }, 800);
  }

  function wakeUp() {
    if (!state.sleeping) return;
    state.sleeping = false;
    billyBody.classList.remove('sleeping');
    billySpeak('wake');
    showMood('🌞');
    billyHappy(1500);
    switchScene('garden');
  }

  function actionSleep() {
    if (state.sleeping) wakeUp();
    else putToSleep();
  }

  function actionSurprise() {
    if (state.sleeping) return;
    billySpeak('surprise');
    showMood('✨');
    billyHappy();
    billyExcited();
    billyJump();
    spawnHearts(6);
    spawnBubbles(6);
    addCoins(1);
  }

  /* ============================================================
     MINIGAMES
     ============================================================ */
  const games = [
    { id: 'guess',  icon: '🎲', name: 'Adivinha',   badge: '1–100',   init: initGuessGame },
    { id: 'memory', icon: '🧠', name: 'Memória',    badge: '6 pares', init: initMemoryGame },
    { id: 'math',   icon: '🧮', name: 'Matemática', badge: 'Cálculo', init: initMathGame }
  ];

  const gamePicker = $('#gamePicker');
  const pickerGrid = $('#pickerGrid');
  const modal = $('#modal');
  const modalIcon = $('#modalIcon');
  const modalName = $('#modalName');
  const modalBadge = $('#modalBadge');
  const modalBody = $('#modalBody');

  function buildPicker() {
    pickerGrid.innerHTML = '';

  const memSymbols = ['🟢','🟩','💚','🍀','🌲','🐢','🐸','🥝'];
  function initMemoryGame(root) {
    const symbols = pickN(memSymbols, 6);
    const deck = shuffle([...symbols, ...symbols]);
    const s = { deck, flipped: [], matched: 0, lock: false, moves: 0, mSym: {} };

    root.innerHTML = `
      <div class="game-desc">🧠 Encontre os <strong>6 pares</strong>.</div>
      <div class="memory-stats">
        <div class="stat-pill">Pares: <strong id="mPairs">0 / 6</strong></div>
        <div class="stat-pill">Movimentos: <strong id="mMoves">0</strong></div>
        <button class="btn" id="mReset">🔄 Embaralhar</button>
      </div>
      <div class="memory-grid" id="mGrid"></div>
      <div class="feedback" id="mFeedback" style="margin-top:16px;">Clique em uma carta!</div>
    `;
    const grid = $('#mGrid', root);
    const fb = $('#mFeedback', root);
    const pe = $('#mPairs', root);
    const me = $('#mMoves', root);

    function update() { pe.textContent = `${s.matched} / 6`; me.textContent = s.moves; }

    function render() {
      grid.innerHTML = '';
      s.deck.forEach((symbol, idx) => {
        const card = document.createElement('div');
        card.className = 'mem-card';
        if (symbol === '✔') {
          card.classList.add('matched');
          card.textContent = s.mSym[idx] || '';
        } else if (s.flipped.includes(idx)) {
          card.classList.add('flipped');
          card.textContent = symbol;
        } else {
          card.innerHTML = '<span class="back-icon">●</span>';
        }
        card.addEventListener('click', () => onClick(idx));
        grid.appendChild(card);
      });
    }

    function onClick(idx) {
      if (s.lock) return;
      if (s.deck[idx] === '✔') return;
      if (s.flipped.includes(idx)) return;
      if (s.flipped.length === 2) return;

      s.flipped.push(idx);
      render();
      if (s.flipped.length === 2) {
        s.moves++; update();
        const [a, b] = s.flipped;
        if (s.deck[a] === s.deck[b]) {
          s.mSym[a] = s.deck[a]; s.mSym[b] = s.deck[b];
          s.deck[a] = '✔'; s.deck[b] = '✔';
          s.matched++; s.flipped = [];
          update(); render();
          if (s.matched === 6) {
            fb.className = 'feedback success';
            fb.textContent = `🎉 Parabéns! ${s.moves} movimentos!`;
            showMood('🏆'); spawnHearts(6);
            addCoins(6);
            showToast('+6 🪙 pelo jogo!', 1800, true);
          } else {
            fb.className = 'feedback success';
            fb.textContent = '✅ Par encontrado!';
          }
        } else {
          s.lock = true;
          fb.className = 'feedback error';
          fb.textContent = '❌ Não combinam.';
          setTimeout(() => { s.flipped = []; s.lock = false; render(); }, 800);
        }
      }
    }
    $('#mReset', root).addEventListener('click', () => initMemoryGame(root));
    update(); render();
  }

  function pickN(arr, n) {
    const c = [...arr]; const r = [];
    while (r.length < n && c.length > 0) {
      const i = rand(0, c.length - 1);
      r.push(c.splice(i, 1)[0]);
    }
    return r;
  }

    matchOi: (text) => {
      const clean = text.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
        .replace(/[^a-z\s]/g, ' ').replace(/\s+/g, ' ').trim();
      const matches = [...clean.matchAll(/\boi{1,9}\b|\boi{10}\b/g)];
      if (matches.length === 0) return null;
      let maxIs = 1;
      matches.forEach(m => {
        const word = m[0];
        const iCount = word.length - 1;
        if (iCount > maxIs) maxIs = iCount;
      });
      if (maxIs === 1) return { r: ["Oi! 😊", "Oi! Como você está?", "Oi! Tava com saudade!", "Oi! Que bom te ver!", "Oi! Vamos conversar?"]};
      if (maxIs <= 3) return { r: [`O${'i'.repeat(maxIs)}! Animado hoje! 😄`, `O${'i'.repeat(maxIs)}! Gostei do entusiasmo!`, `O${'i'.repeat(maxIs)}! Contagiou o Billy!`]};
      if (maxIs <= 6) return { r: [`O${'i'.repeat(maxIs)}!! Quantos "i"s! 😆`, `O${'i'.repeat(maxIs)}!! Adorei a energia!`, `O${'i'.repeat(maxIs)}!! Isso sim é saudação!`]};

    interpret: (input) => {

      if (/^(ola|eae|e ai|hey|hello|bom dia|boa tarde|boa noite|oie)\b/.test(clean)) return billyAI.greetings();

  function tickStats() {
    const now = Date.now();
    const elapsed = now - state.lastTick;
    state.lastTick = now;

    if (state.sleeping) {
      state.sleep = clamp(state.sleep + (elapsed / 1000) * 1.1, 0, 100);
      updateStats();
      return;
    }

    state.hunger = clamp(state.hunger - (elapsed / FOME_DURACAO_MS) * 100, 0, 100);
    state.sleep = clamp(state.sleep - (elapsed / SONO_DURACAO_MS) * 100, 0, 100);
    state.happy = clamp(state.happy - (elapsed / (180 * 60 * 1000)) * 100, 0, 100);
    state.clean = clamp(state.clean - (elapsed / SUJEIRA_DURACAO_MS) * 100, 0, 100);
    updateStats();

    if (state.hunger < 20 && Math.random() > 0.7) { showMood('🍖'); if (Math.random() > 0.5) billySpeak('hungry'); }
    if (state.sleep < 20 && Math.random() > 0.7) { showMood('😴'); if (Math.random() > 0.5) billySpeak('sleepy'); }
    if (state.clean < 25 && Math.random() > 0.75) { showMood('🧼'); if (Math.random() > 0.5) billySpeak('dirty'); }
    if (state.sleep <= 5 && !state.sleeping) { showToast("Billy dormiu de tanto sono! 💤"); putToSleep(); }

    // idle animations
    if (Math.random() > 0.97 && !billyBody.classList.contains('jumping') && !billyBody.classList.contains('sleeping')) {
      billyJump();
    }
  }

  setInterval(tickStats, 1000);

    const container = $('#pollenContainer');
    if (!container) return;
    container.innerHTML = '';
    for (let i = 0; i < 15; i++) {
      const p = document.createElement('div');
      p.className = 'pollen';
      p.style.left = rand(0, 100) + '%';
      p.style.top = rand(20, 80) + '%';
      p.style.animationDelay = (Math.random() * 12) + 's';
      p.style.animationDuration = (10 + Math.random() * 8) + 's';
      container.appendChild(p);
    }
  }

  /* ============================================================
     INICIALIZAÇÃO
     ============================================================ */
  document.addEventListener('DOMContentLoaded', () => {
    generateGrass();
    generatePollen();
    buildPicker();
    updateStats();

    setTimeout(() => {
      addChatMessage("Oi! Eu sou o Billy Byte! 🤖 Agora tenho banheiro, cozinha nova e uma LOJA! Clica na geladeira 🧊 pra comprar comida pra mim!", 'billy');
    }, 800);

    setTimeout(() => { if (hintEl) hintEl.style.display = 'none'; }, 7000);
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      closeModal();
      closeShop();
      gamePicker.classList.remove('active');
      chatPanel.classList.remove('open');
    }
  });

})();
</script>
</body>
</html>
